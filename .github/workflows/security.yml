name: Security

on:
  push:
    branches: ['**']
  pull_request:
    branches: ['**']

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm install --legacy-peer-deps

      - name: Set environment variables from GitHub Secrets
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          GOOGLE_AUTH_CLIENT_ID: ${{ secrets.GOOGLE_AUTH_CLIENT_ID }}
          GOOGLE_AUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_AUTH_CLIENT_SECRET }}
        run: |
          echo "JWT_SECRET=$JWT_SECRET" >> "$GITHUB_ENV"
          echo "GOOGLE_AUTH_CLIENT_ID=$GOOGLE_AUTH_CLIENT_ID" >> "$GITHUB_ENV"
          echo "GOOGLE_AUTH_CLIENT_SECRET=$GOOGLE_AUTH_CLIENT_SECRET" >> "$GITHUB_ENV"

      - name: npm audit
        run: npm audit --audit-level=high || true

      - name: Build
        run: npm run build

      - name: Test
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
        run: npm test || true
